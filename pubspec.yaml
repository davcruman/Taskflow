name: taskflow
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  provider: ^6.1.5+1
  logger: ^2.7.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  table_calendar: ^3.2.0
  flutter_timezone: ^5.0.2
  
  # Nuevas dependencias para idiomas y ajustes
  easy_localization: ^3.0.7
  app_settings: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Configuración obligatoria para los idiomas
  assets:
    - assets/translations/